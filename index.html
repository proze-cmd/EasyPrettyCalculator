<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#ffd6ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Kid Calc — a pretty calculator for little mathematicians</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <h1 class="title"><span class="title-emoji" aria-hidden="true">🧮</span> Kid Calc</h1>
      <div class="topbar__tools">
        <button id="materialsBtn" class="icon-btn" aria-label="Choose what to count with">🐶</button>
        <button id="settingsBtn" class="icon-btn" aria-label="Open settings" title="Settings">⚙️</button>
      </div>
    </header>

    <button id="levelBadge" class="level-badge" title="Tap to change level">
      <span class="level-badge__num">Level 1</span>
      <span class="level-badge__name">Count to 10</span>
    </button>

    <main class="stage">
      <div
        id="display"
        class="display"
        role="button"
        tabindex="0"
        aria-label="Number display. Tap to see it a fun new way."
      ></div>

      <div id="journey" class="journey is-hidden" aria-label="Ways to see this number"></div>

      <p id="tapHint" class="tap-hint">
        <span class="tap-hint__icons" aria-hidden="true">👆 ✨ 🐰</span>
        <span class="tap-hint__text">Tap it to see it a new way</span>
      </p>
    </main>

    <div id="keypad" class="keypad" role="group" aria-label="Calculator buttons"></div>
  </div>

  <!-- Settings sheet -->
  <div id="settingsOverlay" class="overlay hidden" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet__handle" aria-hidden="true"></div>
      <div class="sheet__head">
        <h2 id="settingsTitle" class="sheet__title">Settings</h2>
        <button id="settingsClose" class="icon-btn" aria-label="Close settings">✖️</button>
      </div>

      <section class="setting">
        <div class="setting__label">
          <span class="setting__name">Level</span>
          <span id="levelValue" class="setting__value">1</span>
        </div>
        <input
          id="levelSlider"
          class="slider"
          type="range"
          min="1"
          max="7"
          step="1"
          value="1"
          aria-label="Difficulty level"
        />
        <div class="setting__level-card">
          <div id="levelSliderName" class="setting__level-name">Count to 10</div>
          <div id="levelSliderBlurb" class="setting__level-blurb">Tap the numbers 1 to 10.</div>
        </div>
      </section>

      <section class="setting setting--row">
        <div class="setting__label">
          <span class="setting__name">🔊 Sounds</span>
        </div>
        <button id="soundToggle" class="toggle" role="switch" aria-checked="true" aria-label="Sounds">
          <span class="toggle__dot"></span>
        </button>
      </section>

      <section class="setting setting--row">
        <div class="setting__label">
          <span class="setting__name">🗣️ Say the numbers</span>
        </div>
        <button id="speechToggle" class="toggle" role="switch" aria-checked="true" aria-label="Say the numbers">
          <span class="toggle__dot"></span>
        </button>
      </section>

      <section class="setting">
        <div class="setting__label">
          <span class="setting__name">🎨 Colors</span>
        </div>
        <div class="segmented" role="radiogroup" aria-label="Color theme">
          <button id="themeBright" class="segmented__btn" role="radio" aria-checked="true">
            🌈 Bright
          </button>
          <button id="themeCalm" class="segmented__btn" role="radio" aria-checked="false">
            🍃 Calm
          </button>
        </div>
      </section>

      <p class="sheet__footnote">Made with 💗 for little mathematicians.</p>
    </div>
  </div>

  <!-- Choose what to count with -->
  <div id="materialsOverlay" class="overlay hidden" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="materialsTitle">
      <div class="sheet__handle" aria-hidden="true"></div>
      <div class="sheet__head">
        <h2 id="materialsTitle" class="sheet__title">What shall we count?</h2>
        <button id="materialsClose" class="icon-btn" aria-label="Close">✖️</button>
      </div>
      <div id="materialsGrid" class="materials"></div>
      <button id="materialsSurprise" class="surprise" type="button">🎲 Surprise me every time</button>
    </div>
  </div>

  <!-- Layer for confetti / sparkles so it floats above everything -->
  <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
